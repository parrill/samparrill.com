<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sam Parrill</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      color: #171717;
      background: #fff;
    }

    body {
      margin: 0;
      background: #fff;
    }

    main {
      box-sizing: border-box;
      max-width: 42rem;
      padding: 5.5rem 1.5rem 3rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: 2rem;
      line-height: 1.15;
      font-weight: 400;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sam Parrill</h1>
    <p><a id="email" href="mailto:sam [at] samparrill.com">sam [at] samparrill.com</a></p>
  </main>
  <script>
    document.getElementById('email').href = 'mailto:' + 'sam' + '@' + 'samparrill.com';
  </script>
</body>
</html>
